[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apileaks"
version = "1.0.0"
description = "Enterprise-grade API fuzzing and OWASP testing tool"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "APILeak Team", email = "team@apileak.com" }
]
keywords = ["api", "security", "fuzzing", "owasp", "pentest", "apileaks"]
classifiers = [
    # Beta, not Alpha: all 10 OWASP API Security Top 10 2023 modules are
    # implemented (plus 2 additional modules beyond the Top 10), the
    # entrypoint monolith was decomposed, the ruff/mypy quality gates are
    # green, and the test suite (2300+ tests) is now gated in CI via the
    # pytest job in .github/workflows/code-quality.yml (see
    # technical-debt/code-quality-audit.md).
    # Not yet "5 - Production/Stable": PyPI/.deb publishing is currently
    # disabled for this release. Bump to Stable once that is resolved.
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "structlog>=23.1.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "httpx[socks]>=0.24.0",
    "aiohttp>=3.8.0",
    "requests>=2.31.0",
    "orjson>=3.9.0",
    "jinja2>=3.1.0",
    "lxml>=4.9.0",
    "cryptography>=41.0.0",
    "tqdm>=4.65.0",
    "colorama>=0.4.6",
    "rich>=13.4.0",
    "defusedxml>=0.7.1",
    "pyotp==2.9.0",
]

[project.optional-dependencies]
# uvloop acelera asyncio en Linux/macOS (no disponible en Windows)
fast = [
    "uvloop>=0.17.0; sys_platform != 'win32'",
]
# Requerido solo por ci-cd/scripts/aws_security_hub.py (publicación de findings
# en AWS Security Hub). No es una dependencia del core: instalar con
# `pip install .[aws]` únicamente si se usa esa integración de CI/CD.
aws = [
    "boto3>=1.34.0",
]
# Soporte de auditoría de GCP API Gateway.
# Instalar con: `pip install apileaks[gcp]`
gcp = [
    "google-cloud-api-gateway>=1.5.0",
    "google-auth>=2.20.0",
    "google-api-python-client>=2.95.0",
]
# Soporte de auditoría de Azure API Management.
# Instalar con: `pip install apileaks[azure]`
azure = [
    "azure-identity>=1.14.0",
    "azure-mgmt-apimanagement>=3.0.0",
    "azure-mgmt-authorization>=3.0.0",
]
# Servidor MCP: expone las capacidades de APILeak como MCP tools invocables
# por agentes de IA (Claude, Kiro, etc.).
# Instalar con: `pip install apileaks[mcp]`
mcp = [
    "mcp==1.28.1",
    "jsonschema>=4.0.0",
]
# Asistencia de IA: triage/deduplicación de hallazgos con LLMs.
# Instalar con: `pip install apileaks[ai]`           → AnthropicProvider + OpenAIProvider
# Para Amazon Bedrock añadir también [aws]:
# `pip install apileaks[ai,aws]`                      → todos los proveedores
# boto3 (BedrockProvider) ya está declarado en el extra [aws] — no se duplica aquí.
ai = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "hypothesis>=6.82.0",
    "ruff==0.9.10",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pip-audit>=2.7.0",
    # Generación de SBOM CycloneDX (Req 13.3 / OWASP MCP04).
    # Usar con: cyclonedx-py environment --output-format JSON --outfile sbom-mcp.cdx.json
    "cyclonedx-bom==4.6.1",
]

[project.scripts]
# El comando que el usuario ejecutará en la terminal: `apileaks`
apileaks = "apileaks:cli"

[project.urls]
Homepage = "https://github.com/apileak/owasp-enhancement"
Repository = "https://github.com/apileak/owasp-enhancement"
"Bug Tracker" = "https://github.com/apileak/owasp-enhancement/issues"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "venv",
    "tests",
    ".hypothesis",
    "ci-cd",
    "__pycache__",
    "examples",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — manejado por formatter
    "B008",  # function calls in default args (común en Click)
]

[tool.ruff.lint.isort]
known-first-party = ["apileaks", "cli", "core", "modules", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
strict_optional = false
warn_redundant_casts = true
warn_unused_ignores = false
exclude = '''(?x)(
    ^venv/
    | ^tests/
    | ^\.hypothesis/
    | ^ci-cd/
    | ^examples/
)'''

# Baseline (2026-10-02): these modules had pre-existing type errors when the
# mypy gate was first turned on (see technical-debt/code-quality-audit.md,
# issue #9). They are exempted here so the gate starts green today and still
# catches *new* type errors everywhere else, including new files. Shrink this
# list as each module gets cleaned up — do not add modules to it casually.
[[tool.mypy.overrides]]
# utils.jwt_utils (2026-10-02): VERIFIED, not unaudited noise. All 7 errors
# here were individually read and traced to two already-confirmed false-
# positive patterns (see technical-debt/code-quality-audit.md #16 / the
# ssrf_testing.py and http_client.py entries): (a) cryptography's bundled type
# stubs mark concrete hash/curve classes (hashes.SHA256, ec.SECP256R1, etc.) as
# instantiating an "abstract" base that they actually fully implement — a
# known upstream stub-completeness gap, not our bug; (b) a handful of
# multi-algorithm-dispatch variables (`pad`, `public_key`) are legitimately
# assigned different-but-structurally-equivalent concrete types across
# if/elif/else branches of a key/padding-format dispatch, consumed uniformly
# afterward. Fixing (a) requires upstream stub fixes; fixing (b) here would
# mean restructuring working crypto-dispatch code for no behavioral gain.
module = ["utils.jwt_utils"]
ignore_errors = true

[tool.setuptools.packages.find]
# Incluye los paquetes Python (cli, core, modules, utils, mcp_server)
where = ["."]
include = ["apileaks*", "cli*", "core*", "modules*", "utils*", "mcp_server*"]
exclude = ["tests*", "venv*", ".hypothesis*"]

[tool.setuptools.package-data]
# Archivos de datos que se incluyen dentro del paquete instalado
"*" = [
    "wordlists/*.txt",
    "config/*.yaml",
    "config/*.yml",
    "templates/*",
]
