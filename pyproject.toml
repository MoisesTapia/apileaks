[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apileaks"
version = "0.2.1"
description = "Enterprise-grade API fuzzing and OWASP testing tool"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "APILeak Team", email = "team@apileak.com" }
]
keywords = ["api", "security", "fuzzing", "owasp", "pentest", "apileaks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "structlog>=23.1.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "httpx[socks]>=0.24.0",
    "aiohttp>=3.8.0",
    "requests>=2.31.0",
    "orjson>=3.9.0",
    "jinja2>=3.1.0",
    "lxml>=4.9.0",
    "cryptography>=41.0.0",
    "tqdm>=4.65.0",
    "colorama>=0.4.6",
    "rich>=13.4.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# uvloop acelera asyncio en Linux/macOS (no disponible en Windows)
fast = [
    "uvloop>=0.17.0; sys_platform != 'win32'",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "hypothesis>=6.82.0",
    "ruff==0.9.10",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
# El comando que el usuario ejecutará en la terminal: `apileaks`
apileaks = "apileaks:cli"

[project.urls]
Homepage = "https://github.com/apileak/owasp-enhancement"
Repository = "https://github.com/apileak/owasp-enhancement"
"Bug Tracker" = "https://github.com/apileak/owasp-enhancement/issues"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "venv",
    "tests",
    ".hypothesis",
    "ci-cd",
    "__pycache__",
    "examples",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — manejado por formatter
    "B008",  # function calls in default args (común en Click)
]

[tool.ruff.lint.isort]
known-first-party = ["apileaks", "cli", "core", "modules", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.setuptools.packages.find]
# Incluye los paquetes Python (cli, core, modules, utils)
where = ["."]
include = ["apileaks*", "cli*", "core*", "modules*", "utils*"]
exclude = ["tests*", "venv*", ".hypothesis*"]

[tool.setuptools.package-data]
# Archivos de datos que se incluyen dentro del paquete instalado
"*" = [
    "wordlists/*.txt",
    "config/*.yaml",
    "config/*.yml",
    "templates/*",
]
