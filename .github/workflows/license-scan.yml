name: Escaneo de Licencias

on:
  push:
    branches: [main, develop, v0.2.0]
    paths:
      - "requirements.txt"
      - "setup.py"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "setup.py"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  license-check:
    name: pip-licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar pip-licenses
        run: pip install pip-licenses

      - name: Listar licencias
        run: |
          pip-licenses \
            --format=columns \
            --with-authors \
            --with-urls

      - name: Validar licencias permitidas
        run: |
          pip-licenses \
            --allow-only="MIT License;Apache Software License;BSD License;ISC License (ISCL);Python Software Foundation License;Mozilla Public License 2.0 (MPL 2.0);The Unlicense (Unlicense);Public Domain"
