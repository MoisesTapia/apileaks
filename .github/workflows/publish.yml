  # ── 3. GitHub Release ─────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # needs: [publish-pypi, build-deb]  # deshabilitado temporalmente
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "apileaks ${{ github.ref_name }}"
          body: |
            ## Instalación

            **pip / uv (recomendado):**
            ```bash
            pip install apileaks
            uv tool install apileaks
            pipx install apileaks
            ```

            **Kali Linux / Parrot OS / Debian / Ubuntu:**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/apileaks_*.deb
            sudo dpkg -i apileaks_*.deb
            sudo apt-get install -f
            ```

            **macOS (Homebrew):**
            ```bash
            brew tap ${{ github.repository_owner }}/apileaks
            brew install apileaks
            ```
          draft: false
          prerelease: false
