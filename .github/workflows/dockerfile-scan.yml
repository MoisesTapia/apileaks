name: Escaneo de Dockerfile

on:
  push:
    branches: [main, develop, v0.2.0]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: apileaks

jobs:
  hadolint:
    name: Hadolint — Lint del Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Hadolint
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint && chmod +x /usr/local/bin/hadolint

      - name: Run Hadolint
        run: |
          hadolint Dockerfile \
            --ignore DL3018 \
            --failure-threshold error

  trivy:
    name: Trivy — CVEs en imagen construida
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen local
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Instalar Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Trivy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 1 \
            ${{ env.IMAGE_NAME }}:scan
