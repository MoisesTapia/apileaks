name: Escaneo de Dockerfile — Hadolint & Trivy

on:
  push:
    branches: [main, develop, v0.2.0]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
  schedule:
    # Escaneo semanal de la imagen publicada (lunes 03:00 UTC)
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  IMAGE_NAME: apileaks

jobs:
  hadolint:
    name: Hadolint — Lint del Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hadolint (SARIF)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true       # no bloquear para poder subir el SARIF primero
          # Ignorar reglas de Alpine específicas que no aplican al proyecto:
          # DL3018 = pin version en apk → aceptable para imagen base slim
          ignore: DL3018

      - name: Upload SARIF a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint-dockerfile

      - name: Run Hadolint (modo estricto — falla en errores)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error   # solo falla en nivel ERROR, no WARNING
          ignore: DL3018

      - name: Upload artefacto Hadolint
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-sarif
          path: hadolint-results.sarif
          retention-days: 30

  trivy-config:
    name: Trivy — Misconfiguration en Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy config scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"    # no bloquear para poder subir SARIF

      - name: Upload SARIF a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-dockerfile-config

      - name: Run Trivy config scan (tabla — falla en CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Upload artefacto Trivy config
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-config-sarif
          path: trivy-config-results.sarif
          retention-days: 30

  trivy-image:
    name: Trivy — CVEs en imagen Docker construida
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen local (sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-docker-image

      - name: Run Trivy image scan (tabla — falla en CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload artefacto Trivy imagen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-sarif
          path: trivy-image-results.sarif
          retention-days: 30
