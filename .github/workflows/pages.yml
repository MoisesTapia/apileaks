name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:   # Allow manual trigger from the Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; cancel in-progress builds on new push.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Build job ────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for git-revision-date plugin

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/mkdocs*.txt"

      - name: Install MkDocs and dependencies
        run: |
          pip install \
            mkdocs==1.6.1 \
            mkdocs-material==9.5.44 \
            mkdocs-minify-plugin==0.8.0 \
            pymdown-extensions==10.12 \
            mike==2.1.3

      - name: Create assets directory (if missing)
        run: |
          mkdir -p docs/assets
          # Copy logo if it exists in images/
          if [ -f images/apileaks_logo.png ]; then
            cp images/apileaks_logo.png docs/assets/logo.png
            cp images/apileaks_logo.png docs/assets/favicon.png
          fi
          # Create a minimal extra.css to suppress missing-file warnings
          touch docs/assets/extra.css

      - name: Build documentation
        # Note: --strict is omitted because some pre-existing docs contain broken anchors.
        # New docs should be authored without broken internal links.
        run: mkdocs build --verbose

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ── Deploy job (main branch only) ────────────────────────────────────────
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
