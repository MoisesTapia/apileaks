name: Escaneo de Librerías — Safety & pip-audit

on:
  push:
    branches: [main, develop, v0.2.0]
    paths:
      - "requirements.txt"
      - "setup.py"
      - "pyproject.toml"
  pull_request:
    branches: [main]
  schedule:
    # Escaneo diario a las 06:00 UTC para detectar CVEs nuevos
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  pip-audit:
    name: pip-audit (CVEs en dependencias)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (SARIF)
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format sarif \
            --output pip-audit-results.sarif \
            --progress-spinner off
        continue-on-error: true

      - name: Upload SARIF a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pip-audit-results.sarif
          category: pip-audit-dependencies

      - name: Run pip-audit (JSON — para artefacto)
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output pip-audit-results.json \
            --progress-spinner off
        continue-on-error: true

      - name: Mostrar resumen en logs
        run: |
          pip-audit \
            --requirement requirements.txt \
            --progress-spinner off
        # Falla el job si hay vulnerabilidades conocidas

      - name: Upload artefactos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-results
          path: |
            pip-audit-results.sarif
            pip-audit-results.json
          retention-days: 30

  safety:
    name: Safety (base de datos PyUp)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Safety
        run: pip install safety

      - name: Run Safety
        run: |
          safety check \
            --file requirements.txt \
            --full-report \
            --output text
        # safety check sale con código != 0 si encuentra CVEs → falla el job
        env:
          # Token opcional de Safety DB (más actualizado)
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
