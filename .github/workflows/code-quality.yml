name: Code Quality — Ruff

on:
  push:
    branches: [main, develop, v0.2.0, v0.3.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff Lint & Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.9.10

      - name: Ruff — Lint
        run: |
          ruff check . \
            --exclude venv,tests,.hypothesis,ci-cd,examples \
            --output-format=github

      - name: Ruff — Format check
        run: |
          ruff format --check . \
            --exclude venv,tests,.hypothesis,ci-cd,examples

  mypy:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy
        run: pip install mypy>=1.5.0

      - name: Mypy — Type check
        run: |
          python -m mypy --config-file pyproject.toml \
            apileaks.py cli core modules utils

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

  dependency-audit:
    name: pip-audit — MCP & AI extras
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install "pip-audit>=2.7.0"

      # Audits the exact pinned dependency tree for the [mcp] extra.
      # Uses hash-verified requirements-mcp.txt (generated via pip-compile
      # --generate-hashes). pip-audit exits non-zero on any CVE, which
      # causes the pipeline to fail. (Requirement 13.2 / OWASP MCP04)
      - name: Audit [mcp] extra — hash-verified (requirements-mcp.txt)
        run: pip-audit -r requirements-mcp.txt

      # For the [ai] extra there is no pre-compiled lockfile, so install
      # into the current environment and then let pip-audit scan what landed.
      # A fresh GitHub Actions runner means only [ai] transitive deps are
      # present, keeping the blast radius focused on those packages.
      - name: Install [ai] extra
        run: pip install -e ".[ai]"

      - name: Audit [ai] extra — installed environment
        run: pip-audit
