# GitHub Actions Workflow for APILeak OWASP Enhancement
# Enterprise-grade API security testing in CI/CD pipelines

name: APILeak Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security scans
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API URL to scan'
        required: true
        type: string
      scan_type:
        description: 'Type of scan to perform'
        required: true
        default: 'dir'
        type: choice
        options:
        - dir
        - par
        - full
      rate_limit:
        description: 'Requests per second limit'
        required: false
        default: '10'
        type: string

env:
  # Docker configuration
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/apileak
  
  # APILeak configuration
  APILEAK_LOG_LEVEL: WARNING
  APILEAK_RATE_LIMIT: 20
  APILEAK_TIMEOUT: 30
  
  # Security thresholds (Requirements 9.4)
  CRITICAL_THRESHOLD: 0   # Fail pipeline if any critical vulnerabilities found
  HIGH_THRESHOLD: 5       # Fail pipeline if more than 5 high vulnerabilities found
  MEDIUM_THRESHOLD: 20    # Fail pipeline if more than 20 medium vulnerabilities found

  # ── OpenAPI / Swagger discovery ──────────────────────────────────────
  APILEAK_OPENAPI_URL: ${{ vars.APILEAK_OPENAPI_URL }}
  APILEAK_OPENAPI_FILE: ${{ vars.APILEAK_OPENAPI_FILE }}

  # ── Auto-auth flow ────────────────────────────────────────────────────
  APILEAK_LOGIN_URL: ${{ vars.APILEAK_LOGIN_URL }}
  APILEAK_LOGIN_TOKEN_FIELD: ${{ vars.APILEAK_LOGIN_TOKEN_FIELD || 'access_token' }}
  APILEAK_LOGIN_REFRESH_TOKEN_FIELD: ${{ vars.APILEAK_LOGIN_REFRESH_TOKEN_FIELD }}
  APILEAK_LOGIN_MFA_FIELD: ${{ vars.APILEAK_LOGIN_MFA_FIELD || 'totp_code' }}

  # ── JWT attack suite ──────────────────────────────────────────────────
  APILEAK_JWT_ATTACKS: ${{ vars.APILEAK_JWT_ATTACKS }}
  APILEAK_JWT_SECRETS_WORDLIST: ${{ vars.APILEAK_JWT_SECRETS_WORDLIST || 'wordlists/jwt_secrets.txt' }}

  # ── BOLA testing ──────────────────────────────────────────────────────
  APILEAK_BOLA_TEST: ${{ vars.APILEAK_BOLA_TEST || 'false' }}
  APILEAK_BOLA_OWNER_ID: ${{ vars.APILEAK_BOLA_OWNER_ID }}
  APILEAK_BOLA_USER_IDS: ${{ vars.APILEAK_BOLA_USER_IDS }}
  APILEAK_BOLA_ROLES: ${{ vars.APILEAK_BOLA_ROLES }}
  APILEAK_SAFE_MODE: ${{ vars.APILEAK_SAFE_MODE || 'false' }}

  # ── Broken Auth testing ───────────────────────────────────────────────
  APILEAK_AUTH_TEST: ${{ vars.APILEAK_AUTH_TEST || 'false' }}
  APILEAK_AUTH_CONCURRENCY: ${{ vars.APILEAK_AUTH_CONCURRENCY || '10' }}

  # ── Report formats ────────────────────────────────────────────────────
  APILEAK_REPORT_FORMATS: ${{ vars.APILEAK_REPORT_FORMATS || 'html,json' }}
  APILEAK_CSV_DELIMITER: ${{ vars.APILEAK_CSV_DELIMITER || ';' }}
  APILEAK_PROJECT_NAME: ${{ vars.APILEAK_PROJECT_NAME || github.repository }}

  # ── Security gate ─────────────────────────────────────────────────────
  APILEAK_CRITICAL_THRESHOLD: ${{ vars.APILEAK_CRITICAL_THRESHOLD || '0' }}
  APILEAK_HIGH_THRESHOLD: ${{ vars.APILEAK_HIGH_THRESHOLD || '5' }}
  APILEAK_MEDIUM_THRESHOLD: ${{ vars.APILEAK_MEDIUM_THRESHOLD || '20' }}
  APILEAK_GATE_FAIL_ON_WARN: ${{ vars.APILEAK_GATE_FAIL_ON_WARN || 'false' }}

  # ── AWS / VPC (used only in AWS pipeline; harmless here) ─────────────
  APILEAK_USE_VPC_ENDPOINT: ${{ vars.APILEAK_USE_VPC_ENDPOINT || 'false' }}

jobs:
  # Build and test APILeak
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --cov=core --cov=modules --cov=utils --cov-report=xml
        python -c "from core import APILeakCore; print('APILeak modules import successfully')"
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # API Security Scan - Directory Fuzzing
  security-scan-endpoints:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: vars.API_TARGET_URL != ''
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Create reports directory
      run: mkdir -p reports
    
    - name: Run APILeak directory scan
      run: |
        docker run --rm \
          -e APILEAK_LOG_LEVEL=${{ env.APILEAK_LOG_LEVEL }} \
          -e APILEAK_RATE_LIMIT=${{ env.APILEAK_RATE_LIMIT }} \
          -e APILEAK_TARGET=${{ vars.API_TARGET_URL }} \
          -v $(pwd)/reports:/app/reports \
          ${{ needs.build-and-test.outputs.image }} dir \
          --target ${{ vars.API_TARGET_URL }} \
          --wordlist wordlists/endpoints.txt \
          --output apileak-endpoints-${{ github.run_id }} \
          --log-level ${{ env.APILEAK_LOG_LEVEL }} \
          --rate-limit ${{ env.APILEAK_RATE_LIMIT }}
    
    - name: Check security thresholds
      run: |
        if [ -f "reports/apileak-endpoints-${{ github.run_id }}.json" ]; then
          python ci-cd/scripts/check_thresholds.py \
            --report "reports/apileak-endpoints-${{ github.run_id }}.json" \
            --critical-threshold ${{ env.CRITICAL_THRESHOLD }} \
            --high-threshold ${{ env.HIGH_THRESHOLD }} \
            --medium-threshold ${{ env.MEDIUM_THRESHOLD }}
        fi
    
    - name: Upload scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: apileak-endpoints-results
        path: reports/
        retention-days: 7

  # API Security Scan - Parameter Fuzzing
  security-scan-parameters:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: vars.API_TARGET_URL != ''
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Create reports directory
      run: mkdir -p reports
    
    - name: Run APILeak parameter scan
      run: |
        docker run --rm \
          -e APILEAK_LOG_LEVEL=${{ env.APILEAK_LOG_LEVEL }} \
          -e APILEAK_RATE_LIMIT=${{ env.APILEAK_RATE_LIMIT }} \
          -e APILEAK_TARGET=${{ vars.API_TARGET_URL }} \
          -e APILEAK_JWT_TOKEN="${{ secrets.API_JWT_TOKEN }}" \
          -v $(pwd)/reports:/app/reports \
          ${{ needs.build-and-test.outputs.image }} par \
          --target ${{ vars.API_TARGET_URL }} \
          --wordlist wordlists/parameters.txt \
          --output apileak-parameters-${{ github.run_id }} \
          --log-level ${{ env.APILEAK_LOG_LEVEL }} \
          --rate-limit ${{ env.APILEAK_RATE_LIMIT }} \
          ${{ secrets.API_JWT_TOKEN && '--jwt' }} ${{ secrets.API_JWT_TOKEN }}
    
    - name: Check security thresholds
      run: |
        if [ -f "reports/apileak-parameters-${{ github.run_id }}.json" ]; then
          python ci-cd/scripts/check_thresholds.py \
            --report "reports/apileak-parameters-${{ github.run_id }}.json" \
            --critical-threshold ${{ env.CRITICAL_THRESHOLD }} \
            --high-threshold ${{ env.HIGH_THRESHOLD }} \
            --medium-threshold ${{ env.MEDIUM_THRESHOLD }}
        fi
    
    - name: Upload scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: apileak-parameters-results
        path: reports/
        retention-days: 7

  # Full OWASP Security Scan
  security-scan-full:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: vars.API_TARGET_URL != '' && vars.ENABLE_FULL_SCAN == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Create reports directory
      run: mkdir -p reports
    
    - name: Run APILeak full scan
      run: |
        docker run --rm \
          -e APILEAK_LOG_LEVEL=${{ env.APILEAK_LOG_LEVEL }} \
          -e APILEAK_RATE_LIMIT=${{ env.APILEAK_RATE_LIMIT }} \
          -e APILEAK_TARGET=${{ vars.API_TARGET_URL }} \
          -e APILEAK_JWT_TOKEN="${{ secrets.API_JWT_TOKEN }}" \
          -e APILEAK_MODULES="${{ vars.OWASP_MODULES || 'bola,auth,property,function_auth' }}" \
          -v $(pwd)/reports:/app/reports \
          -v $(pwd)/config:/app/config:ro \
          ${{ needs.build-and-test.outputs.image }} scan \
          --target ${{ vars.API_TARGET_URL }} \
          --output apileak-full-${{ github.run_id }} \
          --log-level ${{ env.APILEAK_LOG_LEVEL }} \
          --rate-limit ${{ env.APILEAK_RATE_LIMIT }} \
          --modules "${{ vars.OWASP_MODULES || 'bola,auth,property,function_auth' }}" \
          ${{ secrets.API_JWT_TOKEN && '--jwt' }} ${{ secrets.API_JWT_TOKEN }} \
          ${{ vars.API_CONFIG_FILE && '--config' }} ${{ vars.API_CONFIG_FILE }}
    
    - name: Check security thresholds
      run: |
        if [ -f "reports/apileak-full-${{ github.run_id }}.json" ]; then
          python ci-cd/scripts/check_thresholds.py \
            --report "reports/apileak-full-${{ github.run_id }}.json" \
            --critical-threshold ${{ env.CRITICAL_THRESHOLD }} \
            --high-threshold ${{ env.HIGH_THRESHOLD }} \
            --medium-threshold ${{ env.MEDIUM_THRESHOLD }}
        fi
    
    - name: Upload scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: apileak-full-results
        path: reports/
        retention-days: 30

  # Manual workflow dispatch scan
  manual-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Create reports directory
      run: mkdir -p reports
    
    - name: Run APILeak scan
      run: |
        docker run --rm \
          -e APILEAK_LOG_LEVEL=${{ env.APILEAK_LOG_LEVEL }} \
          -e APILEAK_RATE_LIMIT=${{ github.event.inputs.rate_limit || env.APILEAK_RATE_LIMIT }} \
          -e APILEAK_TARGET=${{ github.event.inputs.target_url }} \
          -v $(pwd)/reports:/app/reports \
          ${{ needs.build-and-test.outputs.image }} ${{ github.event.inputs.scan_type }} \
          --target ${{ github.event.inputs.target_url }} \
          --output apileak-manual-${{ github.run_id }} \
          --log-level ${{ env.APILEAK_LOG_LEVEL }} \
          --rate-limit ${{ github.event.inputs.rate_limit || env.APILEAK_RATE_LIMIT }}
    
    - name: Upload scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: apileak-manual-results
        path: reports/
        retention-days: 7

  # Generate consolidated security report
  generate-security-report:
    needs: [security-scan-endpoints, security-scan-parameters]
    runs-on: ubuntu-latest
    if: always() && vars.API_TARGET_URL != ''
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install jinja2 lxml
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: reports/
    
    - name: Generate consolidated report
      run: |
        python ci-cd/scripts/generate_consolidated_report.py \
          --input-dir reports/ \
          --output reports/consolidated-security-report-${{ github.run_id }}.html \
          --pipeline-id ${{ github.run_id }} \
          --project-name "${{ github.repository }}" \
          --commit-sha "${{ github.sha }}"
    
    - name: Generate SARIF report
      run: |
        python ci-cd/scripts/generate_sarif_report.py \
          --input-dir reports/ \
          --output apileak-results.sarif
    
    - name: Upload SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: apileak-results.sarif
        category: apileak-security-scan
    
    - name: Upload consolidated report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: consolidated-security-report
        path: reports/consolidated-security-report-${{ github.run_id }}.html
        retention-days: 30

  # Pull Request Security Scan (lightweight)
  pr-security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.API_TARGET_URL != ''
    needs: build-and-test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Create reports directory
      run: mkdir -p reports
    
    - name: Run quick security scan
      run: |
        docker run --rm \
          -e APILEAK_LOG_LEVEL=ERROR \
          -e APILEAK_RATE_LIMIT=30 \
          -e APILEAK_TARGET=${{ vars.API_TARGET_URL }} \
          -v $(pwd)/reports:/app/reports \
          ${{ needs.build-and-test.outputs.image }} dir \
          --target ${{ vars.API_TARGET_URL }} \
          --wordlist wordlists/endpoints.txt \
          --output apileak-pr-${{ github.event.number }} \
          --log-level ERROR \
          --rate-limit 30 \
          --response 200,201,202,204,301,302,401,403
    
    - name: Comment PR with results
      uses: actions/github-script@v6
      if: always()
      with:
        script: |
          const fs = require('fs');
          const path = 'reports/apileak-pr-${{ github.event.number }}.json';
          
          if (fs.existsSync(path)) {
            const results = JSON.parse(fs.readFileSync(path, 'utf8'));
            const stats = results.statistics || {};
            
            const comment = `## 🔒 APILeak Security Scan Results
            
            **Scan Type:** Quick Directory Fuzzing
            **Target:** ${{ vars.API_TARGET_URL }}
            **Scan ID:** apileak-pr-${{ github.event.number }}
            
            ### Results Summary
            - **Total Findings:** ${stats.findings_count || 0}
            - **Critical:** ${stats.critical_findings || 0}
            - **High:** ${stats.high_findings || 0}
            - **Medium:** ${stats.medium_findings || 0}
            - **Low:** ${stats.low_findings || 0}
            - **Info:** ${stats.info_findings || 0}
            
            ${stats.critical_findings > 0 ? '⚠️ **Critical vulnerabilities found! Please review before merging.**' : '✅ No critical vulnerabilities detected.'}
            
            Full scan results are available in the workflow artifacts.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }
    
    - name: Upload PR scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: apileak-pr-results
        path: reports/
        retention-days: 3

  # ── JWT Attack Flow ────────────────────────────────────────────────────
  # Runs auth_flow.py when login vars are present, then propagates the
  # captured JWT token to downstream jobs.
  jwt-attack-flow:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: vars.API_TARGET_URL != '' && vars.APILEAK_LOGIN_URL != ''
    outputs:
      jwt_token: ${{ steps.auth.outputs.jwt_token }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run auth_flow.py — capture JWT
      id: auth
      env:
        APILEAK_LOGIN_URL: ${{ env.APILEAK_LOGIN_URL }}
        APILEAK_LOGIN_USERNAME: ${{ secrets.APILEAK_LOGIN_USERNAME }}
        APILEAK_LOGIN_PASSWORD: ${{ secrets.APILEAK_LOGIN_PASSWORD }}
        APILEAK_LOGIN_TOKEN_FIELD: ${{ env.APILEAK_LOGIN_TOKEN_FIELD }}
        APILEAK_LOGIN_REFRESH_TOKEN_FIELD: ${{ env.APILEAK_LOGIN_REFRESH_TOKEN_FIELD }}
        APILEAK_LOGIN_MFA_TOTP_SECRET: ${{ secrets.APILEAK_LOGIN_MFA_TOTP_SECRET }}
        APILEAK_LOGIN_MFA_FIELD: ${{ env.APILEAK_LOGIN_MFA_FIELD }}
      run: |
        set -euo pipefail
        python ci-cd/scripts/auth_flow.py
        # auth_flow.py writes APILEAK_JWT_TOKEN=<value> to $GITHUB_ENV
        # and also emits it as a step output for downstream jobs
        if [ -f /tmp/apileak_env ]; then
          source /tmp/apileak_env
          echo "jwt_token=${APILEAK_JWT_TOKEN}" >> "$GITHUB_OUTPUT"
          echo "APILEAK_JWT_TOKEN=${APILEAK_JWT_TOKEN}" >> "$GITHUB_ENV"
        fi

  # ── Swagger / OpenAPI Security Scan ────────────────────────────────────
  # Discovers endpoints from OpenAPI spec, runs auth flow, executes
  # JWT attack suite and BOLA testing based on environment configuration.
  swagger-security-scan:
    needs: [build-and-test, security-scan-endpoints, security-scan-parameters]
    runs-on: ubuntu-latest
    if: always() && vars.API_TARGET_URL != '' && (vars.APILEAK_OPENAPI_URL != '' || vars.APILEAK_OPENAPI_FILE != '')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create reports directory
      run: mkdir -p reports

    - name: Validate configuration
      run: python ci-cd/scripts/validate_config.py
      env:
        APILEAK_OPENAPI_URL: ${{ env.APILEAK_OPENAPI_URL }}
        APILEAK_OPENAPI_FILE: ${{ env.APILEAK_OPENAPI_FILE }}
        APILEAK_LOGIN_URL: ${{ env.APILEAK_LOGIN_URL }}
        APILEAK_LOGIN_USERNAME: ${{ secrets.APILEAK_LOGIN_USERNAME }}
        APILEAK_LOGIN_PASSWORD: ${{ secrets.APILEAK_LOGIN_PASSWORD }}
        APILEAK_JWT_TOKEN: ${{ secrets.API_JWT_TOKEN }}
        APILEAK_JWT_ATTACKS: ${{ env.APILEAK_JWT_ATTACKS }}
        APILEAK_TARGET: ${{ vars.API_TARGET_URL }}
        APILEAK_BOLA_TEST: ${{ env.APILEAK_BOLA_TEST }}
        APILEAK_BOLA_OWNER_ID: ${{ env.APILEAK_BOLA_OWNER_ID }}
        APILEAK_BOLA_ROLES: ${{ env.APILEAK_BOLA_ROLES }}
        APILEAK_BOLA_ROLE_TOKENS: ${{ secrets.APILEAK_BOLA_ROLE_TOKENS }}
        APILEAK_CSV_DELIMITER: ${{ env.APILEAK_CSV_DELIMITER }}

    - name: Discover OpenAPI endpoints
      run: python ci-cd/scripts/openapi_discoverer.py
      env:
        APILEAK_OPENAPI_URL: ${{ env.APILEAK_OPENAPI_URL }}
        APILEAK_OPENAPI_FILE: ${{ env.APILEAK_OPENAPI_FILE }}
        APILEAK_TARGET: ${{ vars.API_TARGET_URL }}
        PIPELINE_ID: ${{ github.run_id }}

    - name: Run auth_flow.py — capture JWT
      if: vars.APILEAK_LOGIN_URL != ''
      env:
        APILEAK_LOGIN_URL: ${{ env.APILEAK_LOGIN_URL }}
        APILEAK_LOGIN_USERNAME: ${{ secrets.APILEAK_LOGIN_USERNAME }}
        APILEAK_LOGIN_PASSWORD: ${{ secrets.APILEAK_LOGIN_PASSWORD }}
        APILEAK_LOGIN_TOKEN_FIELD: ${{ env.APILEAK_LOGIN_TOKEN_FIELD }}
        APILEAK_LOGIN_REFRESH_TOKEN_FIELD: ${{ env.APILEAK_LOGIN_REFRESH_TOKEN_FIELD }}
        APILEAK_LOGIN_MFA_TOTP_SECRET: ${{ secrets.APILEAK_LOGIN_MFA_TOTP_SECRET }}
        APILEAK_LOGIN_MFA_FIELD: ${{ env.APILEAK_LOGIN_MFA_FIELD }}
      run: |
        python ci-cd/scripts/auth_flow.py
        if [ -f /tmp/apileak_env ]; then
          cat /tmp/apileak_env >> "$GITHUB_ENV"
        fi

    - name: Run APILeaks OpenAPI scan
      run: |
        JWT_TOKEN="${{ secrets.API_JWT_TOKEN }}"
        [ -n "$APILEAK_JWT_TOKEN" ] && JWT_TOKEN="$APILEAK_JWT_TOKEN"
        docker run --rm \
          -e APILEAK_LOG_LEVEL=${{ env.APILEAK_LOG_LEVEL }} \
          -e APILEAK_RATE_LIMIT=${{ env.APILEAK_RATE_LIMIT }} \
          -e APILEAK_TARGET=${{ vars.API_TARGET_URL }} \
          -e APILEAK_JWT_TOKEN="${JWT_TOKEN}" \
          -e APILEAK_OPENAPI_URL="${{ env.APILEAK_OPENAPI_URL }}" \
          -e APILEAK_OPENAPI_FILE="${{ env.APILEAK_OPENAPI_FILE }}" \
          -e APILEAK_SAFE_MODE="${{ env.APILEAK_SAFE_MODE }}" \
          -v $(pwd)/reports:/app/reports \
          ${{ needs.build-and-test.outputs.image }} scan \
          --openapi \
          --target ${{ vars.API_TARGET_URL }} \
          --output apileak-openapi-${{ github.run_id }} \
          --log-level ${{ env.APILEAK_LOG_LEVEL }}

    - name: Run JWT attack suite
      if: vars.APILEAK_JWT_ATTACKS != ''
      env:
        APILEAK_JWT_TOKEN: ${{ secrets.API_JWT_TOKEN }}
        APILEAK_TARGET: ${{ vars.API_TARGET_URL }}
        APILEAK_JWT_ATTACKS: ${{ env.APILEAK_JWT_ATTACKS }}
        APILEAK_JWT_SECRETS_WORDLIST: ${{ env.APILEAK_JWT_SECRETS_WORDLIST }}
        APILEAK_RSA_PUBLIC_KEY: ${{ secrets.APILEAK_RSA_PUBLIC_KEY }}
        PIPELINE_ID: ${{ github.run_id }}
      run: python ci-cd/scripts/jwt_attack_suite.py

    - name: Run BOLA tester
      if: vars.APILEAK_BOLA_TEST == 'true'
      env:
        APILEAK_TARGET: ${{ vars.API_TARGET_URL }}
        APILEAK_JWT_TOKEN: ${{ secrets.API_JWT_TOKEN }}
        APILEAK_BOLA_TEST: ${{ env.APILEAK_BOLA_TEST }}
        APILEAK_BOLA_OWNER_ID: ${{ env.APILEAK_BOLA_OWNER_ID }}
        APILEAK_BOLA_USER_IDS: ${{ vars.APILEAK_BOLA_USER_IDS }}
        APILEAK_BOLA_ROLES: ${{ env.APILEAK_BOLA_ROLES }}
        APILEAK_BOLA_ROLE_TOKENS: ${{ secrets.APILEAK_BOLA_ROLE_TOKENS }}
        APILEAK_SAFE_MODE: ${{ env.APILEAK_SAFE_MODE }}
        PIPELINE_ID: ${{ github.run_id }}
      run: python ci-cd/scripts/bola_tester.py

    - name: Run Broken Auth testing
      if: vars.APILEAK_AUTH_TEST == 'true'
      env:
        APILEAK_TARGET: ${{ vars.API_TARGET_URL }}
        APILEAK_JWT_TOKEN: ${{ secrets.API_JWT_TOKEN }}
        APILEAK_AUTH_TEST: ${{ env.APILEAK_AUTH_TEST }}
        APILEAK_AUTH_CONCURRENCY: ${{ env.APILEAK_AUTH_CONCURRENCY }}
        PIPELINE_ID: ${{ github.run_id }}
      run: python ci-cd/scripts/auth_flow.py --broken-auth-test

    - name: Upload OpenAPI scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: apileak-openapi-results-${{ github.run_id }}
        path: reports/
        retention-days: 7

  # ── Generate Reports ────────────────────────────────────────────────────
  # Runs report_generator.py for all configured formats, uploads the
  # GitLab-compatible gl-sast-report.json as a GitHub SARIF artifact,
  # and uploads JUnit XML for test-results visualisation.
  generate-reports:
    needs: [security-scan-endpoints, security-scan-parameters, swagger-security-scan]
    runs-on: ubuntu-latest
    if: always() && vars.API_TARGET_URL != ''

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download all scan artifacts
      uses: actions/download-artifact@v3
      with:
        path: reports/

    - name: Create reports directory
      run: mkdir -p reports

    - name: Generate reports (all formats)
      env:
        APILEAK_REPORT_FORMATS: ${{ env.APILEAK_REPORT_FORMATS }}
        APILEAK_CSV_DELIMITER: ${{ env.APILEAK_CSV_DELIMITER }}
        APILEAK_PROJECT_NAME: ${{ env.APILEAK_PROJECT_NAME }}
        PIPELINE_ID: ${{ github.run_id }}
      run: |
        python ci-cd/scripts/report_generator.py \
          --input-dir reports/ \
          --output-dir reports/ \
          --pipeline-id ${{ github.run_id }} \
          --project-name "${{ env.APILEAK_PROJECT_NAME }}" \
          --formats "${{ env.APILEAK_REPORT_FORMATS }}"

    - name: Upload gl-sast-report.json as GitHub SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('reports/gl-sast-report.json') != ''
      with:
        sarif_file: reports/gl-sast-report.json
        category: apileak-openapi-security-scan

    - name: Upload JUnit XML for test results
      uses: actions/upload-artifact@v3
      if: always() && hashFiles('reports/apileak-junit-*.xml') != ''
      with:
        name: apileak-junit-results-${{ github.run_id }}
        path: reports/apileak-junit-*.xml
        retention-days: 30

    - name: Upload all generated reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: apileak-generated-reports-${{ github.run_id }}
        path: |
          reports/gl-sast-report.json
          reports/apileak-junit-*.xml
          reports/apileak-report-*.csv
          reports/apileak-report-*.pdf
        retention-days: 30

  # ── Security Gate ───────────────────────────────────────────────────────
  # Runs security_gate.py, which evaluates findings across all scan reports
  # and writes security-gate-result.json unconditionally.
  # Sets the workflow conclusion via exit code:
  #   0 → pass (SUCCESS), 1 → warn (continues), 2 → fail (FAILURE)
  security-gate:
    needs: [generate-reports]
    runs-on: ubuntu-latest
    if: always() && vars.API_TARGET_URL != ''

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download generated reports
      uses: actions/download-artifact@v3
      with:
        name: apileak-generated-reports-${{ github.run_id }}
        path: reports/

    - name: Run security gate evaluation
      env:
        APILEAK_CRITICAL_THRESHOLD: ${{ env.APILEAK_CRITICAL_THRESHOLD }}
        APILEAK_HIGH_THRESHOLD: ${{ env.APILEAK_HIGH_THRESHOLD }}
        APILEAK_MEDIUM_THRESHOLD: ${{ env.APILEAK_MEDIUM_THRESHOLD }}
        APILEAK_GATE_FAIL_ON_WARN: ${{ env.APILEAK_GATE_FAIL_ON_WARN }}
        PIPELINE_ID: ${{ github.run_id }}
      run: |
        python ci-cd/scripts/security_gate.py \
          --findings-dir reports/ \
          --output security-gate-result.json \
          --pipeline-id ${{ github.run_id }}

    - name: Publish security-gate-result.json as artifact
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-gate-result-${{ github.run_id }}
        path: security-gate-result.json
        retention-days: 30
