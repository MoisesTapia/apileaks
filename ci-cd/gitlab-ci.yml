# GitLab CI/CD Template for APILeak OWASP Enhancement
# Enterprise-grade API security testing in CI/CD pipelines

stages:
  - build
  - test
  - security-scan
  - report

variables:
  # Docker configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  
  # APILeak configuration
  APILEAK_IMAGE: "apileak:latest"
  APILEAK_LOG_LEVEL: "WARNING"
  APILEAK_RATE_LIMIT: "20"
  APILEAK_TIMEOUT: "30"
  
  # Security thresholds (Requirements 9.4)
  CRITICAL_THRESHOLD: "0"  # Fail pipeline if any critical vulnerabilities found
  HIGH_THRESHOLD: "5"      # Fail pipeline if more than 5 high vulnerabilities found
  MEDIUM_THRESHOLD: "20"   # Fail pipeline if more than 20 medium vulnerabilities found

  # ── New variables (CI/CD Integration spec) ────────────────────────────────

  # OpenAPI / Swagger discovery (Req 1)
  APILEAK_OPENAPI_URL: ""        # URL to OpenAPI/Swagger spec
  APILEAK_OPENAPI_FILE: ""       # Local path to spec (priority over URL when both set)

  # Auto-auth flow (Req 2)
  APILEAK_LOGIN_URL: ""              # Login endpoint for automatic authentication
  APILEAK_LOGIN_USERNAME: ""         # Login username — mask in all logs
  APILEAK_LOGIN_PASSWORD: ""         # Login password — store as a protected secret
  APILEAK_LOGIN_TOKEN_FIELD: "access_token"   # JWT field in login response
  APILEAK_LOGIN_REFRESH_TOKEN_FIELD: ""       # Refresh-token field (optional)
  APILEAK_LOGIN_MFA_TOTP_SECRET: ""           # TOTP secret for MFA logins
  APILEAK_LOGIN_MFA_FIELD: "totp_code"        # Body field for TOTP code

  # JWT token & attacks (Req 3)
  APILEAK_JWT_TOKEN: ""          # Pre-existing or auto-captured JWT
  APILEAK_JWT_ATTACKS: ""        # Comma-separated attack names or "all"
  APILEAK_JWT_SECRETS_WORDLIST: "wordlists/jwt_secrets.txt"
  APILEAK_RSA_PUBLIC_KEY: ""     # RSA public key for algorithm_confusion attack

  # BOLA testing (Req 4)
  APILEAK_BOLA_TEST: "false"         # Enable OpenAPI-based BOLA testing
  APILEAK_BOLA_OWNER_ID: ""          # Authenticated user's own resource ID
  APILEAK_BOLA_USER_IDS: ""          # Comma-separated cross-user IDs
  APILEAK_BOLA_ROLES: ""             # Comma-separated role names
  APILEAK_BOLA_ROLE_TOKENS: ""       # Comma-separated JWTs matching BOLA_ROLES order

  # Broken Auth testing (Req 12)
  APILEAK_AUTH_TEST: "false"         # Enable OpenAPI-based Broken Auth testing
  APILEAK_AUTH_CONCURRENCY: "10"     # Parallel requests for Broken Auth (1–50)

  # Report formats (Req 6–9)
  APILEAK_REPORT_FORMATS: "html,json"   # Comma-separated: html,json,sarif,junit,csv,pdf
  APILEAK_CSV_DELIMITER: ";"            # Single-character CSV delimiter
  APILEAK_PROJECT_NAME: ""              # Project name for PDF cover page

  # Security Gate thresholds — unified names (Req 10)
  APILEAK_CRITICAL_THRESHOLD: "0"    # Findings above this → FAILURE (exit 2)
  APILEAK_HIGH_THRESHOLD: "5"        # Findings above this → UNSTABLE (exit 1)
  APILEAK_MEDIUM_THRESHOLD: "20"     # Findings above this → UNSTABLE (exit 1)
  APILEAK_GATE_FAIL_ON_WARN: "false" # Escalate UNSTABLE to FAILURE when "true"/"1"

  # Misc (Req 4.6, 5.8)
  APILEAK_SAFE_MODE: "false"         # Restrict all scans to GET-only
  APILEAK_S3_BUCKET: ""              # S3 bucket for AWS report upload
  APILEAK_USE_VPC_ENDPOINT: "false"  # Use private VPC endpoint as target (AWS)

# Build APILeak Docker image
build-apileak:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker info
  script:
    - docker build -t $APILEAK_IMAGE .
    - docker images
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Unit tests for APILeak
test-apileak:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
  script:
    - python -m pytest tests/ -v --cov=core --cov=modules --cov=utils
    - python -c "from core import APILeakCore; print('APILeak modules import successfully')"
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# API Security Scan - Directory Fuzzing
security-scan-endpoints:
  stage: security-scan
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    SCAN_TYPE: "dir"
    APILEAK_TARGET: "${API_TARGET_URL}"  # Set this in GitLab CI/CD variables
  before_script:
    - docker build -t $APILEAK_IMAGE .
  script:
    - |
      # Run directory fuzzing scan
      docker run --rm \
        -e APILEAK_LOG_LEVEL=$APILEAK_LOG_LEVEL \
        -e APILEAK_RATE_LIMIT=$APILEAK_RATE_LIMIT \
        -e APILEAK_TARGET=$APILEAK_TARGET \
        -v $(pwd)/reports:/app/reports \
        $APILEAK_IMAGE dir \
        --target $APILEAK_TARGET \
        --wordlist wordlists/endpoints.txt \
        --output apileak-endpoints-$CI_PIPELINE_ID \
        --log-level $APILEAK_LOG_LEVEL \
        --rate-limit $APILEAK_RATE_LIMIT
    - |
      # Check exit code and thresholds
      EXIT_CODE=$?
      echo "APILeak directory scan exit code: $EXIT_CODE"
      
      # Parse results and check thresholds
      if [ -f "reports/apileak-endpoints-$CI_PIPELINE_ID.json" ]; then
        python ci-cd/scripts/check_thresholds.py \
          --report "reports/apileak-endpoints-$CI_PIPELINE_ID.json" \
          --critical-threshold $CRITICAL_THRESHOLD \
          --high-threshold $HIGH_THRESHOLD \
          --medium-threshold $MEDIUM_THRESHOLD
      fi
      
      exit $EXIT_CODE
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/apileak-endpoints-$CI_PIPELINE_ID-junit.xml
    expire_in: 1 week
  allow_failure: false
  rules:
    - if: $API_TARGET_URL && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $API_TARGET_URL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# API Security Scan - Parameter Fuzzing
security-scan-parameters:
  stage: security-scan
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    SCAN_TYPE: "par"
    APILEAK_TARGET: "${API_TARGET_URL}"
  before_script:
    - docker build -t $APILEAK_IMAGE .
  script:
    - |
      # Run parameter fuzzing scan
      docker run --rm \
        -e APILEAK_LOG_LEVEL=$APILEAK_LOG_LEVEL \
        -e APILEAK_RATE_LIMIT=$APILEAK_RATE_LIMIT \
        -e APILEAK_TARGET=$APILEAK_TARGET \
        -e APILEAK_JWT_TOKEN="${API_JWT_TOKEN}" \
        -v $(pwd)/reports:/app/reports \
        $APILEAK_IMAGE par \
        --target $APILEAK_TARGET \
        --wordlist wordlists/parameters.txt \
        --output apileak-parameters-$CI_PIPELINE_ID \
        --log-level $APILEAK_LOG_LEVEL \
        --rate-limit $APILEAK_RATE_LIMIT \
        ${API_JWT_TOKEN:+--jwt $API_JWT_TOKEN}
    - |
      # Check exit code and thresholds
      EXIT_CODE=$?
      echo "APILeak parameter scan exit code: $EXIT_CODE"
      
      if [ -f "reports/apileak-parameters-$CI_PIPELINE_ID.json" ]; then
        python ci-cd/scripts/check_thresholds.py \
          --report "reports/apileak-parameters-$CI_PIPELINE_ID.json" \
          --critical-threshold $CRITICAL_THRESHOLD \
          --high-threshold $HIGH_THRESHOLD \
          --medium-threshold $MEDIUM_THRESHOLD
      fi
      
      exit $EXIT_CODE
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/apileak-parameters-$CI_PIPELINE_ID-junit.xml
    expire_in: 1 week
  allow_failure: false
  rules:
    - if: $API_TARGET_URL && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $API_TARGET_URL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Full OWASP Security Scan
security-scan-full:
  stage: security-scan
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    SCAN_TYPE: "full"
    APILEAK_TARGET: "${API_TARGET_URL}"
  before_script:
    - docker build -t $APILEAK_IMAGE .
  script:
    - |
      # Run full OWASP security scan
      docker run --rm \
        -e APILEAK_LOG_LEVEL=$APILEAK_LOG_LEVEL \
        -e APILEAK_RATE_LIMIT=$APILEAK_RATE_LIMIT \
        -e APILEAK_TARGET=$APILEAK_TARGET \
        -e APILEAK_JWT_TOKEN="${API_JWT_TOKEN}" \
        -e APILEAK_MODULES="${OWASP_MODULES:-bola,auth,property,function_auth}" \
        -v $(pwd)/reports:/app/reports \
        -v $(pwd)/config:/app/config:ro \
        $APILEAK_IMAGE scan \
        --target $APILEAK_TARGET \
        --output apileak-full-$CI_PIPELINE_ID \
        --log-level $APILEAK_LOG_LEVEL \
        --rate-limit $APILEAK_RATE_LIMIT \
        --modules "${OWASP_MODULES:-bola,auth,property,function_auth}" \
        ${API_JWT_TOKEN:+--jwt $API_JWT_TOKEN} \
        ${API_CONFIG_FILE:+--config $API_CONFIG_FILE}
    - |
      # Check exit code and thresholds
      EXIT_CODE=$?
      echo "APILeak full scan exit code: $EXIT_CODE"
      
      if [ -f "reports/apileak-full-$CI_PIPELINE_ID.json" ]; then
        python ci-cd/scripts/check_thresholds.py \
          --report "reports/apileak-full-$CI_PIPELINE_ID.json" \
          --critical-threshold $CRITICAL_THRESHOLD \
          --high-threshold $HIGH_THRESHOLD \
          --medium-threshold $MEDIUM_THRESHOLD
      fi
      
      exit $EXIT_CODE
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/apileak-full-$CI_PIPELINE_ID-junit.xml
    expire_in: 1 week
  allow_failure: false
  rules:
    - if: $API_TARGET_URL && $ENABLE_FULL_SCAN == "true"
  when: manual

# Generate consolidated security report
generate-security-report:
  stage: report
  image: python:3.11-slim
  before_script:
    - pip install jinja2 lxml
  script:
    - |
      # Generate consolidated report from all scan results
      python ci-cd/scripts/generate_consolidated_report.py \
        --input-dir reports/ \
        --output reports/consolidated-security-report-$CI_PIPELINE_ID.html \
        --pipeline-id $CI_PIPELINE_ID \
        --project-name "$CI_PROJECT_NAME" \
        --commit-sha "$CI_COMMIT_SHA"
    - |
      # Generate GitLab security report format
      python ci-cd/scripts/generate_gitlab_security_report.py \
        --input-dir reports/ \
        --output gl-sast-report.json
  artifacts:
    when: always
    paths:
      - reports/consolidated-security-report-$CI_PIPELINE_ID.html
    reports:
      sast: gl-sast-report.json
    expire_in: 1 month
  rules:
    - if: $API_TARGET_URL
      when: always

# Security scan for merge requests (lightweight)
security-scan-mr:
  stage: security-scan
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    APILEAK_TARGET: "${API_TARGET_URL}"
    APILEAK_RATE_LIMIT: "30"  # Higher rate limit for faster MR scans
  before_script:
    - docker build -t $APILEAK_IMAGE .
  script:
    - |
      # Quick security scan for merge requests
      docker run --rm \
        -e APILEAK_LOG_LEVEL=ERROR \
        -e APILEAK_RATE_LIMIT=$APILEAK_RATE_LIMIT \
        -e APILEAK_TARGET=$APILEAK_TARGET \
        -v $(pwd)/reports:/app/reports \
        $APILEAK_IMAGE dir \
        --target $APILEAK_TARGET \
        --wordlist wordlists/endpoints.txt \
        --output apileak-mr-$CI_MERGE_REQUEST_IID \
        --log-level ERROR \
        --rate-limit $APILEAK_RATE_LIMIT \
        --response 200,201,202,204,301,302,401,403
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 3 days
  rules:
    - if: $API_TARGET_URL && $CI_PIPELINE_SOURCE == "merge_request_event"

# Cleanup old artifacts
cleanup-artifacts:
  stage: report
  image: alpine:latest
  script:
    - echo "Cleaning up old artifacts and reports"
    - find reports/ -name "*.json" -mtime +7 -delete || true
    - find reports/ -name "*.html" -mtime +7 -delete || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  when: manual

# ─────────────────────────────────────────────────────────────────────────────
# NEW JOB: OpenAPI-based security scan (Req 1, 2, 3, 4, 6.4, 11.1, 11.2)
# Runs in the existing security-scan stage alongside the other scan jobs.
# ─────────────────────────────────────────────────────────────────────────────
swagger-security-scan:
  stage: security-scan
  image: python:3.11-slim
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - pip install -r requirements.txt
    - mkdir -p reports
  script:
    - |
      # ── Step 1: Validate configuration before running any scan (Req 11.3) ──
      python ci-cd/scripts/validate_config.py
      echo "Config validation passed."

    - |
      # ── Step 2: Auto-auth flow — login and capture JWT (Req 2) ─────────────
      if [ -n "$APILEAK_LOGIN_URL" ] && [ -n "$APILEAK_LOGIN_USERNAME" ] && [ -n "$APILEAK_LOGIN_PASSWORD" ]; then
        echo "Running auto-auth flow…"
        python ci-cd/scripts/auth_flow.py
        # auth_flow.py writes APILEAK_JWT_TOKEN to a temp env file; source it.
        if [ -f /tmp/apileak_auth.env ]; then
          set -a && . /tmp/apileak_auth.env && set +a
          echo "JWT captured and exported."
        fi
      fi

    - |
      # ── Step 3: OpenAPI discovery (Req 1) ───────────────────────────────────
      if [ -n "$APILEAK_OPENAPI_URL" ] || [ -n "$APILEAK_OPENAPI_FILE" ]; then
        echo "Running OpenAPI endpoint discovery…"
        python ci-cd/scripts/openapi_discoverer.py
      fi

    - |
      # ── Step 4: APILeaks container scan with --openapi flag ─────────────────
      if [ -n "$APILEAK_OPENAPI_URL" ] || [ -n "$APILEAK_OPENAPI_FILE" ]; then
        OPENAPI_ARGS=""
        if [ -n "$APILEAK_OPENAPI_FILE" ]; then
          OPENAPI_ARGS="--openapi-file $APILEAK_OPENAPI_FILE"
        elif [ -n "$APILEAK_OPENAPI_URL" ]; then
          OPENAPI_ARGS="--openapi $APILEAK_OPENAPI_URL"
        fi

        docker run --rm \
          -e APILEAK_LOG_LEVEL=$APILEAK_LOG_LEVEL \
          -e APILEAK_RATE_LIMIT=$APILEAK_RATE_LIMIT \
          -e APILEAK_TARGET=$APILEAK_TARGET \
          -e APILEAK_JWT_TOKEN="$APILEAK_JWT_TOKEN" \
          -e APILEAK_SAFE_MODE=$APILEAK_SAFE_MODE \
          -v $(pwd)/reports:/app/reports \
          $APILEAK_IMAGE scan \
            --target "$APILEAK_TARGET" \
            $OPENAPI_ARGS \
            --output apileak-openapi-$CI_PIPELINE_ID \
            --log-level $APILEAK_LOG_LEVEL \
            --rate-limit $APILEAK_RATE_LIMIT \
            ${APILEAK_JWT_TOKEN:+--jwt "$APILEAK_JWT_TOKEN"}
      fi

    - |
      # ── Step 5: JWT attack suite (Req 3) ────────────────────────────────────
      if [ -n "$APILEAK_JWT_ATTACKS" ]; then
        echo "Running JWT attack suite: $APILEAK_JWT_ATTACKS"
        python ci-cd/scripts/jwt_attack_suite.py
      fi

    - |
      # ── Step 6: BOLA testing (Req 4) ────────────────────────────────────────
      if [ "$APILEAK_BOLA_TEST" = "true" ]; then
        echo "Running BOLA tester…"
        python ci-cd/scripts/bola_tester.py
      fi

    - |
      # ── Step 7: Broken Auth testing (Req 12) ────────────────────────────────
      if [ "$APILEAK_AUTH_TEST" = "true" ]; then
        echo "Running Broken Auth testing (via auth_flow.py)…"
        APILEAK_BROKEN_AUTH_MODE=true python ci-cd/scripts/auth_flow.py
      fi

    - |
      # ── Step 8: Generate GitLab SAST report (Req 6) ─────────────────────────
      echo "Generating report formats: $APILEAK_REPORT_FORMATS"
      python ci-cd/scripts/report_generator.py \
        --input-dir reports/ \
        --pipeline-id "$CI_PIPELINE_ID" \
        --project-name "${APILEAK_PROJECT_NAME:-$CI_PROJECT_NAME}" \
        --formats "${APILEAK_REPORT_FORMATS:-sarif,junit}"

  artifacts:
    when: always
    paths:
      - reports/
    reports:
      # GitLab automatically processes this file as a Security Dashboard report
      # on Merge Requests (Req 6.4)
      sast: gl-sast-report.json
      junit: reports/apileak-junit-all-$CI_PIPELINE_ID.xml
    expire_in: 1 month
  rules:
    - if: $API_TARGET_URL && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $API_TARGET_URL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


# ─────────────────────────────────────────────────────────────────────────────
# NEW JOB: Unified Security Gate (Req 10, 11.1, 11.2)
# Runs in the report stage AFTER all scan jobs and the existing report job.
# The existing generate-security-report job is NOT modified.
# ─────────────────────────────────────────────────────────────────────────────
security-gate:
  stage: report
  image: python:3.11-slim
  needs:
    - job: generate-security-report
      optional: true
    - job: swagger-security-scan
      optional: true
  before_script:
    - pip install -r requirements.txt
    - mkdir -p reports
  script:
    - |
      # Evaluate all findings against configured thresholds (Req 10).
      # security_gate.py always writes security-gate-result.json before exiting
      # (Req 10.7), even when findings are missing or an exception occurs.
      python ci-cd/scripts/security_gate.py \
        --findings-dir reports/ \
        --output security-gate-result.json \
        --pipeline-id "$CI_PIPELINE_ID" \
        --critical-threshold "${APILEAK_CRITICAL_THRESHOLD:-$CRITICAL_THRESHOLD}" \
        --high-threshold    "${APILEAK_HIGH_THRESHOLD:-$HIGH_THRESHOLD}" \
        --medium-threshold  "${APILEAK_MEDIUM_THRESHOLD:-$MEDIUM_THRESHOLD}" \
        --fail-on-warn      "${APILEAK_GATE_FAIL_ON_WARN:-false}"
      GATE_EXIT=$?

      # Surface the gate result in the job log for quick visibility.
      if [ -f security-gate-result.json ]; then
        echo "=== Security Gate Result ==="
        cat security-gate-result.json
        echo ""
      fi

      exit $GATE_EXIT

  artifacts:
    when: always
    paths:
      - security-gate-result.json
    expire_in: 1 month
  rules:
    - if: $API_TARGET_URL
      when: always
